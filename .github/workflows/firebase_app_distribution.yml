# GitHub Actions Workflow: Firebase App Distribution (Staging)
#
# REQUIRED GITHUB SECRETS:
# 1. FIREBASE_APP_ID_ANDROID: The Firebase Android App ID (e.g. 1:1234567890:android:abc123def456)
# 2. FIREBASE_SERVICE_ACCOUNT_KEY: The full JSON contents of a Google Cloud Service Account key with Firebase App Distribution Admin role.

name: Firebase App Distribution (Staging)

on:
  push:
    branches:
      - stag
  workflow_dispatch:

jobs:
  distribute:
    name: Build & Upload to Firebase App Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@v11.16.0
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app "${{ secrets.FIREBASE_APP_ID_ANDROID }}" --groups "testers" --release-notes "Staging build from commit ${{ github.sha }}"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
